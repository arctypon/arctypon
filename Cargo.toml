[workspace]
resolver = "3"
members = ["crates/arctypon-core", "kernel"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arctypon/arctypon"
authors = ["靈月夜 (Luna-night)"]

[workspace.dependencies]
arctypon-core = { path = "crates/arctypon-core", version = "0.0.0" }
ostd = "0.19.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
